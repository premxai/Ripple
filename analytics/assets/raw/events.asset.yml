# Every town event, written by the backend to ripple/data/events.csv.
# The seed path is relative to this file.
name: raw.events
type: duckdb.seed
parameters:
  path: ../../../data/events.csv
columns:
  - name: event_id
    type: string
    checks:
      - name: not_null
      - name: unique
  - name: run_id
    type: string
    checks:
      - name: not_null
  - name: type
    type: string
    checks:
      - name: not_null
